---
# Список пакетів Chocolatey для Windows-хостів (група windows_hosts)
windows_packages:
  - notepadplusplus
  - wireshark
  - googlechrome
  - git
  - 7zip
  - vscode

# GoogleChrome у choco-пакеті іноді має застарілий SHA256 (Google публікує MSI
# раніше за оновлення маніфесту) — для цих пакетів перевірку хешів пропускаємо
chocolatey_no_checksum:
  - googlechrome
